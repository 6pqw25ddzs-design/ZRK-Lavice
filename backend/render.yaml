services:
  - type: web
    name: zrk-lavice-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zrk-lavice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://zrklavice.me,https://zrk-lavice.vercel.app
      - key: PORT
        value: 3001

databases:
  - name: zrk-lavice-db
    databaseName: zrk_lavice
    plan: starter
